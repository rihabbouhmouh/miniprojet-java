# ============================================
# Configuration g�n�rale du projet
# ============================================
spring.application.name=projetjava
vaadin.launch-browser=true

# ============================================
# Base de donn�es H2
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recr�er les tables et ex�cuter data.sql au d�marrage
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Ordre d'ex�cution : d'abord cr�er les tables, puis ins�rer les donn�es
spring.jpa.defer-datasource-initialization=true

# ============================================
# Logs & Debug
# ============================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=always

# ============================================
# S�curit� - Logging
# ============================================
logging.level.org.springframework.security=DEBUG

# Allow bigger uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ( helps with large posts on Tomcat)
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=-1